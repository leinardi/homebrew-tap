name: CI

# The authoritative checks (pre-commit-all, cask-audit) run on every pull request, every push to main
# and on demand; the reviewdog jobs only annotate pull requests. A release pipeline delivers a new
# cask version as a push to main, and on a push both checks only report (continue-on-error): nothing
# may block or fail a release pipeline's push (AGENTS.md).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job reads the repository and nothing else, unless it says otherwise below.
permissions:
  contents: read

jobs:
  # The authoritative lint gate: every pre-commit hook over every file, with the versions pinned in
  # .pre-commit-config.yaml. The hooks bring their own toolchains (Python, Node and Go hook
  # environments, shellcheck-py), so only pre-commit itself is installed; the license-header hook is
  # plain bash. Nothing is skipped: no dedicated job runs any of these hooks. On a push it only
  # reports, like cask-audit.
  pre-commit-all:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ github.event_name == 'push' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install --no-cache-dir pre-commit==4.6.2

      # Restore only: pre-commit-warmup.yaml saves the entry on main under the same key.
      - name: Restore the pre-commit cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ runner.os }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run every pre-commit hook on every file
        run: pre-commit run --all-files --show-diff-on-failure

      # pre-commit fails a hook that modifies a tracked file, which covers the auto-fixing hooks
      # (markdownlint fix, prettier, the whitespace fixers); this also fails on a file a hook
      # creates, which its diff check does not see, so no fix can pass silently.
      - name: Fail if a hook modified a file
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  actionlint:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review (-reporter=github-pr-review in every
    # action this workflow uses, at the pinned commit), which needs pull-requests: write. It
    # creates no check runs, so checks: write is not needed.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run actionlint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/actionlint@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  pre-commit-hooks:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review (-reporter=github-pr-review in every
    # action this workflow uses, at the pinned commit), which needs pull-requests: write. It
    # creates no check runs, so checks: write is not needed.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run pre-commit hooks + reviewdog diff
        uses: leinardi/gha-pre-commit-reviewdog-actions/pre-commit-hooks@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  markdownlint:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review (-reporter=github-pr-review in every
    # action this workflow uses, at the pinned commit), which needs pull-requests: write. It
    # creates no check runs, so checks: write is not needed.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run markdownlint-cli2 via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/markdownlint-cli2@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  yamllint:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review (-reporter=github-pr-review in every
    # action this workflow uses, at the pinned commit), which needs pull-requests: write. It
    # creates no check runs, so checks: write is not needed.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run yamllint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/yamllint@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review (-reporter=github-pr-review in every
    # action this workflow uses, at the pinned commit), which needs pull-requests: write. It
    # creates no check runs, so checks: write is not needed.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run shellcheck via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/shellcheck@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  conventional-commits:
    # Keeps a human pull request's commits in the same shape as the rest of the
    # history. The local commit-msg hook only runs where `make pre-commit-install`
    # was run; this job is the check that no commit skips. The release pipelines'
    # own pushes (`chore(cask): monmux vX.Y.Z`) never pass through it. It runs the repository's own
    # conventional-pre-commit hook, so --force-scope applies here too, and it
    # skips merge commits. No pull-request title check: squash merging is
    # disabled, so a title never becomes a commit on main. Enabling squash
    # merging would need one added here first.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate the commit messages
        uses: leinardi/gha-pre-commit-reviewdog-actions/conventional-commits@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}

  # Audits every cask as Homebrew itself loads it, on pull requests, on every push to main (which is
  # how a release pipeline delivers a new cask version) and on demand. On a push it only reports: a
  # release pipeline's push is never gated, and a cask it generated is fixed in the producing
  # repository, not here.
  cask-audit:
    runs-on: macos-latest
    timeout-minutes: 20
    continue-on-error: ${{ github.event_name == 'push' }}
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Path-based `brew audit` is disabled for casks, so the checkout is tapped under the tap's own
      # name. The published tap must not be what gets audited: the job fails unless the tapped
      # repository is exactly this checkout.
      - name: Tap this checkout as leinardi/tap
        run: |
          set -euo pipefail
          brew untap leinardi/tap 2>/dev/null || true
          brew tap leinardi/tap "$GITHUB_WORKSPACE"
          TAPPED=$(git -C "$(brew --repository leinardi/tap)" rev-parse HEAD)
          CHECKED_OUT=$(git rev-parse HEAD)
          if [ "$TAPPED" != "$CHECKED_OUT" ]; then
            echo "The tapped leinardi/tap is at $TAPPED, not at this checkout ($CHECKED_OUT)." >&2
            exit 1
          fi

      # Only the casks: `brew style <tap>` also runs shfmt over scripts/bootstrap-mk-common.sh,
      # which is fetched verbatim from leinardi/make-common and not restyled here.
      #
      # Three cops are excluded, each for a layout goreleaser renders and this repository cannot
      # change (the casks are generated):
      # - Cask/StanzaOrder: monmux's postflight_steps comes first because goreleaser can only emit
      #   it as a custom_block, which it renders at the top. See the custom_block note in
      #   leinardi/monmux's .goreleaser.yaml (goreleaser/goreleaser#6870); drop the exclusion
      #   once that workaround goes.
      # - Cask/StanzaGrouping and Layout/FirstArrayElementIndentation: goreleaser puts
      #   `depends_on formula: [` right after the livecheck block, without an empty line, and
      #   indents the array by six spaces.
      - name: Check the style of every cask
        run: |
          set -euo pipefail
          TOKENS=()
          for cask in Casks/*.rb; do
            TOKENS+=("leinardi/tap/$(basename "$cask" .rb)")
          done
          brew style --cask \
            --except-cops Cask/StanzaOrder,Cask/StanzaGrouping,Layout/FirstArrayElementIndentation \
            "${TOKENS[@]}"

      # --online queries the GitHub API for each cask's repository and release. Unauthenticated,
      # that shares the runner IP's 60 requests an hour with every other job on it; the job's
      # read-only token lifts the limit.
      - name: Audit
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: brew audit --tap leinardi/tap --strict --online

  # Stands for the authoritative jobs in one check name. On a pull request every needed job must
  # succeed. Off a pull request conventional-commits is skipped, and on a push pre-commit-all and
  # cask-audit only report, so their failure is a warning here, not a failure: nothing fails a
  # release pipeline's push. The default branch has no ruleset (AGENTS.md), so nothing requires this
  # check today; it is the name to require if one is ever enabled.
  ci-result:
    if: always()
    needs:
      - pre-commit-all
      - conventional-commits
      - cask-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          reported="$(jq -r --arg event "${EVENT}" '
            to_entries[]
            | select(
                $event == "push"
                and (.key == "pre-commit-all" or .key == "cask-audit")
                and .value.result == "failure"
              )
            | "\(.key): \(.value.result)"
          ' <<<"${NEEDS}")"
          if [[ -n "${reported}" ]]; then
            echo "::warning::Report-only jobs failed on this push (see their logs):"
            echo "${reported}"
          fi
          failed="$(jq -r --arg event "${EVENT}" '
            to_entries[]
            | select(.value.result != "success")
            | select(
                (
                  $event != "pull_request"
                  and .key == "conventional-commits"
                  and .value.result == "skipped"
                ) | not
              )
            | select(
                (
                  $event == "push"
                  and (.key == "pre-commit-all" or .key == "cask-audit")
                  and .value.result == "failure"
                ) | not
              )
            | "\(.key): \(.value.result)"
          ' <<<"${NEEDS}")"
          if [[ -n "${failed}" ]]; then
            echo "::error::Needed jobs did not succeed:"
            echo "${failed}"
            exit 1
          fi
          echo "Every needed job succeeded."
